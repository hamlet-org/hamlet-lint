name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel stale runs on the same branch or pull request. This also keeps the
# dependency image publisher ordered with the newest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  OCAML_COMPILER: "5.5.0"
  MINIMUM_DUNE: "3.18.2"
  HAMLET_GIT_URL: https://github.com/hamlet-org/hamlet.git
  # keep this source pin aligned with the companion Hamlet pull request until
  # automatic propagation lands on main. releases use exact published pairs.
  HAMLET_GIT_REF: automatic-propagation-elaboration

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base"
          fi

          git diff --name-only "$base" "$GITHUB_SHA" > changed-files.txt

          docs_only=true
          while IFS= read -r path; do
            case "$path" in
              *.md|LICENSE|knowledge/*|.github/dependabot.yml) ;;
              *) docs_only=false ;;
            esac
          done < changed-files.txt

          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"

  # Resolve the source pin once. The resulting commit is part of the image
  # key: a moving ref such as `main` must never reuse dependencies compiled
  # against an older Hamlet or ppx_hamlet revision.
  resolve-hamlet:
    runs-on: ubuntu-latest
    outputs:
      git_url: ${{ steps.resolve.outputs.git_url }}
      git_commit: ${{ steps.resolve.outputs.git_commit }}
    steps:
      - id: resolve
        shell: bash
        env:
          URL: ${{ env.HAMLET_GIT_URL }}
          REF: ${{ env.HAMLET_GIT_REF }}
        run: |
          set -euo pipefail
          commit=$(git ls-remote "$URL" "$REF" | awk 'NR == 1 { print $1 }')
          if [ -z "$commit" ]; then
            echo "::error::could not resolve Hamlet source pin ${URL}#${REF}"
            exit 1
          fi
          echo "git_url=$URL" >> "$GITHUB_OUTPUT"
          echo "git_commit=$commit" >> "$GITHUB_OUTPUT"

  ensure-ci-image:
    runs-on: ubuntu-latest
    needs: resolve-hamlet
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve CI image
        id: resolve
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HAMLET_GIT_URL: ${{ needs.resolve-hamlet.outputs.git_url }}
          HAMLET_GIT_COMMIT: ${{ needs.resolve-hamlet.outputs.git_commit }}
        run: |
          set -euo pipefail
          image_name="${GITHUB_REPOSITORY,,}-ci"
          short_sha="${SOURCE_SHA:0:12}"
          deps_hash=$(
            {
              sha256sum dune-project ./*.opam .github/docker/ci/Dockerfile
              printf 'ocaml=%s\nhamlet-url=%s\nhamlet-commit=%s\n' \
                "$OCAML_COMPILER" "$HAMLET_GIT_URL" "$HAMLET_GIT_COMMIT"
            } | sha256sum | cut -c1-16
          )

          candidate="ghcr.io/${image_name}:deps-${deps_hash}"
          fallback="ghcr.io/${image_name}:main"
          can_publish=false
          if [ "${{ github.event_name }}" != "pull_request" ] \
            || [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            can_publish=true
          fi

          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          needs_build=false
          image="$candidate"
          if docker manifest inspect "$candidate" >/dev/null 2>&1; then
            echo "using existing ${candidate}"
          elif [ "$can_publish" = "true" ]; then
            needs_build=true
            echo "will build ${candidate}"
          else
            image="$fallback"
            echo "fork pull request cannot publish ${candidate}; falling back to ${fallback}"
          fi

          if [ "$needs_build" != "true" ] && ! docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "::error::CI image not found: $image"
            exit 1
          fi

          {
            echo "build_tags<<EOF"
            echo "$candidate"
            echo "ghcr.io/${image_name}:sha-${short_sha}"
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "ghcr.io/${image_name}:main"
            fi
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "ghcr.io/${image_name}:pr-${PR_NUMBER}"
              echo "ghcr.io/${image_name}:pr-${PR_NUMBER}-${short_sha}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "needs_build=${needs_build}" >> "$GITHUB_OUTPUT"

      - if: steps.resolve.outputs.needs_build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and publish CI image
        if: steps.resolve.outputs.needs_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/docker/ci/Dockerfile
          push: true
          cache-from: type=gha,scope=hamlet-subtractor-ci-image
          cache-to: type=gha,mode=max,scope=hamlet-subtractor-ci-image
          build-args: |
            OCAML_VERSION=${{ env.OCAML_COMPILER }}
            HAMLET_GIT_URL=${{ needs.resolve-hamlet.outputs.git_url }}
            HAMLET_GIT_COMMIT=${{ needs.resolve-hamlet.outputs.git_commit }}
          tags: ${{ steps.resolve.outputs.build_tags }}
          labels: |
            org.opencontainers.image.title=hamlet-subtractor ci
            org.opencontainers.image.description=OCaml CI image for Hamlet Subtractor build, test, docs, format, and opam checks

  build-ubuntu:
    name: build (ubuntu-latest, 5.5.0)
    runs-on: ubuntu-latest
    needs:
      - classify
      - resolve-hamlet
      - ensure-ci-image
    container:
      image: ${{ needs.ensure-ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - if: needs.classify.outputs.docs_only == 'true'
        run: echo "docs-only change; skipping Ubuntu build."

      - if: needs.classify.outputs.docs_only != 'true'
        name: Ensure exact Hamlet source dependencies
        env:
          HAMLET_GIT_URL: ${{ needs.resolve-hamlet.outputs.git_url }}
          HAMLET_GIT_COMMIT: ${{ needs.resolve-hamlet.outputs.git_commit }}
        run: |
          set -euo pipefail
          opam pin add -y --no-action hamlet "${HAMLET_GIT_URL}#${HAMLET_GIT_COMMIT}"
          opam pin add -y --no-action ppx_hamlet "${HAMLET_GIT_URL}#${HAMLET_GIT_COMMIT}"
          opam install -y hamlet ppx_hamlet
          opam install -y . --deps-only --with-test --with-doc --with-dev-setup

      - if: needs.classify.outputs.docs_only != 'true'
        run: make all

  build-dune-minimum:
    name: build (ubuntu-latest, Dune 3.18.2)
    runs-on: ubuntu-latest
    needs:
      - classify
      - resolve-hamlet
    steps:
      - if: needs.classify.outputs.docs_only == 'true'
        run: echo "docs-only change; skipping minimum Dune build."

      - if: needs.classify.outputs.docs_only != 'true'
        uses: actions/checkout@v6

      - if: needs.classify.outputs.docs_only != 'true'
        uses: ./.github/actions/setup-ocaml
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}

      - if: needs.classify.outputs.docs_only != 'true'
        run: opam pin add -y dune ${{ env.MINIMUM_DUNE }}

      - if: needs.classify.outputs.docs_only != 'true'
        env:
          HAMLET_GIT_URL: ${{ needs.resolve-hamlet.outputs.git_url }}
          HAMLET_GIT_COMMIT: ${{ needs.resolve-hamlet.outputs.git_commit }}
        run: |
          set -euo pipefail
          opam pin add -y --no-action hamlet "${HAMLET_GIT_URL}#${HAMLET_GIT_COMMIT}"
          opam pin add -y --no-action ppx_hamlet "${HAMLET_GIT_URL}#${HAMLET_GIT_COMMIT}"
          opam install -y hamlet ppx_hamlet
          opam install -y . --deps-only --with-test --with-doc --with-dev-setup

      - if: needs.classify.outputs.docs_only != 'true'
        run: test "$(opam exec -- dune --version)" = "${{ env.MINIMUM_DUNE }}"

      - if: needs.classify.outputs.docs_only != 'true'
        run: opam exec -- make all

  build-macos:
    name: build (macos-latest, 5.5.0)
    if: ${{ vars.ENABLE_MACOS_CI == 'true' }}
    runs-on: macos-latest
    needs:
      - classify
      - resolve-hamlet
    steps:
      - if: needs.classify.outputs.docs_only == 'true'
        run: echo "docs-only change; skipping macOS build."

      - if: needs.classify.outputs.docs_only != 'true'
        uses: actions/checkout@v6

      - if: needs.classify.outputs.docs_only != 'true'
        uses: ./.github/actions/setup-ocaml
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}

      - if: needs.classify.outputs.docs_only != 'true'
        env:
          HAMLET_GIT_URL: ${{ needs.resolve-hamlet.outputs.git_url }}
          HAMLET_GIT_COMMIT: ${{ needs.resolve-hamlet.outputs.git_commit }}
        run: |
          set -euo pipefail
          opam pin add -y --no-action hamlet "${HAMLET_GIT_URL}#${HAMLET_GIT_COMMIT}"
          opam pin add -y --no-action ppx_hamlet "${HAMLET_GIT_URL}#${HAMLET_GIT_COMMIT}"
          opam install -y hamlet ppx_hamlet
          opam install -y . --deps-only --with-test --with-doc --with-dev-setup
          opam exec -- make all

  quality:
    runs-on: ubuntu-latest
    needs:
      - classify
      - resolve-hamlet
      - ensure-ci-image
    container:
      image: ${{ needs.ensure-ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - if: needs.classify.outputs.docs_only == 'true'
        run: echo "docs-only change; skipping quality checks."

      - if: needs.classify.outputs.docs_only != 'true'
        name: Ensure exact Hamlet source dependencies
        env:
          HAMLET_GIT_URL: ${{ needs.resolve-hamlet.outputs.git_url }}
          HAMLET_GIT_COMMIT: ${{ needs.resolve-hamlet.outputs.git_commit }}
        run: |
          set -euo pipefail
          opam pin add -y --no-action hamlet "${HAMLET_GIT_URL}#${HAMLET_GIT_COMMIT}"
          opam pin add -y --no-action ppx_hamlet "${HAMLET_GIT_URL}#${HAMLET_GIT_COMMIT}"
          opam install -y hamlet ppx_hamlet
          opam install -y . --deps-only --with-test --with-doc --with-dev-setup

      - if: needs.classify.outputs.docs_only != 'true'
        run: make fmt doc opam
