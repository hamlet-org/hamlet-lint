name: release

# release workflow. one run derives the configured current Hamlet release
# family and publishes one package for every supported OCaml patch. each pair
# receives its own Git tag and GitHub Release; the opam-repository submission
# is bundled into one PR.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # derive rows from release/current-hamlet.sh and release/versions.sh, then
  # filter pairs already published or represented by an open upstream PR.
  # there is deliberately no workflow input through which a caller could pick
  # an older Hamlet version, a branch, or a different OCaml matrix.
  plan:
    runs-on: ubuntu-latest
    outputs:
      pairs: ${{ steps.filter.outputs.pairs }}
      count: ${{ steps.filter.outputs.count }}
      hamlet_version: ${{ steps.filter.outputs.hamlet_version }}
      hamlet_release_tag: ${{ steps.filter.outputs.hamlet_release_tag }}
      hamlet_git_commit: ${{ steps.filter.outputs.hamlet_git_commit }}
    steps:
      - name: Checkout release policy
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Derive configured unpublished pairs
        id: filter
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source release/policy.sh
          validate_release_policy
          hamlet_git_commit="$(resolve_current_hamlet_commit)"
          pairs_in="$(release_pairs_json "$hamlet_git_commit")"

          is_published() {
            local pkg="$1"
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/ocaml/opam-repository/contents/packages/hamlet-subtractor/hamlet-subtractor.${pkg}" \
              >/dev/null 2>&1
          }

          collect_in_flight_packages() {
            local prs pr
            prs=$(gh pr list --repo ocaml/opam-repository --state open \
              --search "hamlet-subtractor in:title" --json number --jq '.[].number')
            for pr in $prs; do
              gh pr view "$pr" --repo ocaml/opam-repository --json files \
                --jq '.files[].path' \
                | sed -nE 's|^packages/hamlet-subtractor/hamlet-subtractor\\.([^/]+)/opam$|\\1|p'
            done | sort -u
          }

          mapfile -t in_flight < <(collect_in_flight_packages)
          is_in_flight() {
            local pkg="$1" candidate
            for candidate in "${in_flight[@]}"; do
              [ "$candidate" = "$pkg" ] && return 0
            done
            return 1
          }

          out='[]'
          while read -r pair; do
            hamlet=$(jq -r '.hamlet' <<< "$pair")
            ocaml=$(jq -r '.ocaml' <<< "$pair")
            hamlet_git_commit=$(jq -r '.hamlet_git_commit' <<< "$pair")
            pkg="$(opam_package_name "$ocaml")"
            if is_published "$pkg"; then
              echo "skip ${pkg}: already merged on ocaml/opam-repository"
            elif is_in_flight "$pkg"; then
              echo "skip ${pkg}: already present in an open opam-repository PR"
            else
              echo "keep ${pkg}"
              out=$(jq -c \
                      --arg h "$hamlet" \
                      --arg o "$ocaml" \
                      --arg c "$hamlet_git_commit" \
                      '. + [{"hamlet":$h,"ocaml":$o,"hamlet_git_commit":$c}]' \
                      <<< "$out")
            fi
          done < <(jq -c '.[]' <<< "$pairs_in")
          count=$(jq 'length' <<< "$out")
          echo "pairs=$out" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "hamlet_version=$HAMLET_VERSION" >> "$GITHUB_OUTPUT"
          echo "hamlet_release_tag=$HAMLET_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "hamlet_git_commit=$hamlet_git_commit" >> "$GITHUB_OUTPUT"

  # Per-pair build/test/tag/GitHub Release. Each matrix job mirrors the
  # old single-pair release job exactly, except the rendered opam file
  # is uploaded as an artifact instead of being PR'd inline. Tags and
  # Releases stay 1-per-pair (matches what we had before the bundling).
  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        pair: ${{ fromJSON(needs.plan.outputs.pairs) }}
    runs-on: ubuntu-latest
    env:
      HAMLET_VERSION: ${{ needs.plan.outputs.hamlet_version }}
      HAMLET_RELEASE_TAG: ${{ needs.plan.outputs.hamlet_release_tag }}
      HAMLET_GIT_COMMIT: ${{ needs.plan.outputs.hamlet_git_commit }}
      OCAML_TARGET: ${{ matrix.pair.ocaml }}
      # Opam package version uses the tilde convention for the
      # OCaml-target suffix (idiomatic on opam-repository, see
      # ppxlib.0.38.0~5.5preview for a precedent). The git tag MUST
      # use a hyphen instead, because git refs forbid `~` (see
      # git-check-ref-format(1)). Both forms derive from the same
      # two matrix fields.
      PKG_VERSION: ${{ matrix.pair.hamlet }}~${{ matrix.pair.ocaml }}
      TAG_NAME: v${{ matrix.pair.hamlet }}-${{ matrix.pair.ocaml }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: ./.github/actions/setup-ocaml
        with:
          ocaml-compiler: ${{ matrix.pair.ocaml }}

      - name: Install matching published Hamlet packages
        run: |
          opam install -y "hamlet.${HAMLET_VERSION}" "ppx_hamlet.${HAMLET_VERSION}"
          opam install -y . --deps-only --with-test

      - name: Build & test
        run: |
          opam exec -- dune build
          opam exec -- dune runtest

      - name: Check tag state
        id: tag
        run: |
          git fetch --tags origin
          head_sha=$(git rev-parse HEAD)
          # dereference annotated tags (^{}) to get the underlying commit
          tag_commit=$(git ls-remote origin "refs/tags/${TAG_NAME}^{}" | awk '{print $1}')
          if [ -z "$tag_commit" ]; then
            tag_commit=$(git ls-remote origin "refs/tags/${TAG_NAME}" | awk '{print $1}')
          fi
          if [ -z "$tag_commit" ]; then
            echo "tag ${TAG_NAME} does not exist on origin, will create it"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          elif [ "$tag_commit" = "$head_sha" ]; then
            echo "tag ${TAG_NAME} already points to HEAD (${head_sha}), skipping creation"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            cat >&2 <<DIAG

          *** TAG CONFLICT ***

          The tag ${TAG_NAME} already exists on origin, but it points to
          a different commit than the one this workflow is running on.

            tag   → ${tag_commit}
            HEAD  → ${head_sha}

          Git tags are immutable once published. Moving a tag would break
          anyone who has already fetched the tarball, and opam lockfiles
          or CI caches that recorded the old checksum would silently get
          the wrong source.

          If you are re-running the same release:
            Delete the tag and its GitHub Release first, then re-run.

          If you are publishing a new version:
            Bump the version so a new tag is created instead.

          DIAG
            exit 1
          fi

      - name: Create git archive
        id: archive
        run: |
          rm -rf dist && mkdir -p dist
          TARBALL="dist/hamlet-subtractor-${PKG_VERSION}.tar.gz"
          git archive --format=tar.gz --prefix="hamlet-subtractor-${PKG_VERSION}/" \
            -o "$TARBALL" HEAD
          SHA=$(shasum -a 256 "$TARBALL" | awk '{print $1}')
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Create annotated tag
        if: steps.tag.outputs.exists == 'false'
        run: |
          git tag -a "$TAG_NAME" -m "hamlet-subtractor ${PKG_VERSION}"
          git push origin "$TAG_NAME"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG_NAME} already exists, skipping creation"
          else
            gh release create "$TAG_NAME" "${{ steps.archive.outputs.tarball }}" \
              --title "hamlet-subtractor ${PKG_VERSION}" \
              --notes "Packaging release for Hamlet ${HAMLET_VERSION} (${HAMLET_RELEASE_TAG} at ${HAMLET_GIT_COMMIT}) on OCaml ${OCAML_TARGET}."
          fi
          TARBALL_URL=$(gh release view "$TAG_NAME" --json assets -q '.assets[0].url')
          echo "TARBALL_URL=$TARBALL_URL" >> "$GITHUB_ENV"

      - name: Render opam file
        run: |
          mkdir -p "rendered/${PKG_VERSION}"
          OPAM_OUT="rendered/${PKG_VERSION}/opam"
          sed \
            -e "s|%%VERSION%%|${PKG_VERSION}|g" \
            -e "s|%%HAMLET_VERSION%%|${HAMLET_VERSION}|g" \
            -e "s|%%OCAML_TARGET%%|${OCAML_TARGET}|g" \
            -e "s|%%TARBALL_URL%%|${TARBALL_URL}|g" \
            -e "s|%%CHECKSUM_SHA256%%|${{ steps.archive.outputs.sha256 }}|g" \
            release/hamlet-subtractor.opam.tmpl > "$OPAM_OUT"
          opam lint "$OPAM_OUT"

      # Artifact name encodes the pair so bundle-pr can pattern-download
      # all of them at once. `~` is allowed in artifact names.
      - name: Upload rendered opam
        uses: actions/upload-artifact@v4
        with:
          name: opam-${{ env.PKG_VERSION }}
          path: rendered/${{ env.PKG_VERSION }}/opam
          if-no-files-found: error

  # Bundle every rendered opam into a single PR against opam-repository.
  # Matches the house style for multi-package releases (one PR carrying
  # all the new package directories) and halves the reviewer click count
  # vs. the old one-PR-per-pair shape.
  bundle-pr:
    needs: [plan, build]
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Download all rendered opam files
        uses: actions/download-artifact@v4
        with:
          pattern: opam-*
          path: rendered
          merge-multiple: false

      - name: Open opam-repository PR
        env:
          GH_TOKEN: ${{ secrets.OPAM_REPO_PAT }}
          PAIRS: ${{ needs.plan.outputs.pairs }}
          COUNT: ${{ needs.plan.outputs.count }}
        run: |
          # Check for an existing PR before doing any work. Match on
          # "hamlet-subtractor" in the title among open PRs on the fork.
          existing=$(gh pr list \
            --repo ocaml/opam-repository \
            --search "[new release] hamlet-subtractor in:title" \
            --state open \
            --json number,title \
            --jq '.[] | select(.title | contains("hamlet-subtractor")) | .number' \
            | head -n1)
          if [ -n "$existing" ]; then
            echo "opam-repository PR #${existing} already open for hamlet-subtractor, skipping"
            exit 0
          fi

          WORKDIR=$(mktemp -d)
          gh repo clone ocaml/opam-repository "$WORKDIR" -- --depth=1
          cd "$WORKDIR"

          # Branch name is derived from the run id so two release passes
          # never clash on the fork. Hyphen only (git refs forbid ~).
          BRANCH_NAME="hamlet-subtractor-release-${{ github.run_id }}"
          git checkout -b "$BRANCH_NAME"

          # Drop every rendered opam under its target package directory.
          # Each artifact landed at rendered/opam-<pair>/opam.
          versions=()
          for d in "${GITHUB_WORKSPACE}"/rendered/opam-*; do
            pkg="${d##*/opam-}"
            PKG_DIR="packages/hamlet-subtractor/hamlet-subtractor.${pkg}"
            mkdir -p "$PKG_DIR"
            cp "${d}/opam" "$PKG_DIR/opam"
            git add "$PKG_DIR/opam"
            versions+=("$pkg")
          done

          # Single-pair PRs keep the explicit form; multi-pair PRs use
          # the "(N packages)" form, matching dune/atd/ocurrent style.
          if [ "$COUNT" -eq 1 ]; then
            TITLE="[new release] hamlet-subtractor (${versions[0]})"
          else
            TITLE="[new release] hamlet-subtractor (${COUNT} packages)"
          fi

          # Body lists every pair so reviewers can see the full set
          # without expanding the diff.
          BODY="Automated release of hamlet-subtractor:"$'\n'
          for v in "${versions[@]}"; do
            BODY+="- hamlet-subtractor.${v}"$'\n'
          done

          git -c user.name="hamlet-subtractor release bot" \
              -c user.email="release@hamlet-subtractor" \
              commit -m "$TITLE"
          gh pr create \
            --repo ocaml/opam-repository \
            --title "$TITLE" \
            --body "$BODY"
